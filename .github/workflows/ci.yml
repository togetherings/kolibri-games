name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest -e ".[wikipedia]"
      - run: tools/ci_run.sh "Unit tests" python -m pytest -q
      - name: The Wikipedia ZIM test ran (needs libzim)
        run: python -m pytest -q tests/test_zim.py | tail -1 | tee zim.txt && grep -q "1 passed" zim.txt && echo "::notice title=ZIM test::$(cat zim.txt)"
      - name: Package the games
        run: kolibri-games-pack games/* --out-dir dist/games && ls -l dist/games

  browser:
    name: Browser test (preview server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - run: tools/ci_run.sh "Browser test" python -m tests.e2e_browser --screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots

  kolibri:
    name: Real Kolibri (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    env:
      KOLIBRI_HOME: ${{ github.workspace }}/.kolibri-home
      KOLIBRI_GAMES_PATH: ${{ github.workspace }}/games
      KOLIBRI_RUN_MODE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Kolibri and the plugin
        run: |
          pip install kolibri
          pip install -e ".[wikipedia]"
          echo "::notice title=Kolibri version::$(python -c 'import kolibri; print(kolibri.__version__)')"
      - name: Enable the plugin and migrate
        run: |
          kolibri plugin enable kolibri_games
          kolibri plugin list | grep kolibri_games
          kolibri manage migrate
      - name: Migrations match the models
        run: kolibri manage makemigrations kolibri_games --check --dry-run
      - name: Provision a test device
        run: >
          kolibri manage provisiondevice --facility "Test School" --preset formal
          --superusername admin --superuserpassword admin123 --language_id en --noinput
      - name: Setup check
        run: tools/ci_run.sh "Setup check" kolibri manage kolibri_games_check
      - name: Make a small Wikipedia file for Wiki BLAZE
        run: python -m tests.make_test_zim "$RUNNER_TEMP/tiny-wiki.zim"
      - name: Integration test
        env:
          KOLIBRI_GAMES_TEST_WIKI: ${{ runner.temp }}/tiny-wiki.zim
        run: tools/ci_run.sh "Integration test" kolibri manage shell -c "exec(open('tests/integration/smoke.py').read())"
      - name: Start Kolibri and load the games page
        run: |
          kolibri start --port 8080
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 2; done
          curl -fsSL http://127.0.0.1:8080/en/kolibri_games/ | grep -q "assets/app.js"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/en/kolibri_games/api/games)
          test "$code" = "401"
      - name: Install a browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Sign-in return and Kolibri menu link (real browser)
        run: tools/ci_run.sh "Live browser test" python -m tests.integration.live_browser http://127.0.0.1:8080/ admin admin123
      - name: Stop Kolibri
        if: always()
        run: kolibri stop || true

  installer:
    name: Installer on an IIAB-like system
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the wheel
        run: |
          python3 -m pip install build
          python3 -m build --wheel
      - name: Install Kolibri the way IIAB runs it
        run: |
          sudo python3 -m pip install kolibri
          sudo useradd --system --home-dir /library/kolibri --create-home kolibri
          sudo mkdir -p /library/kolibri && sudo chown kolibri /library/kolibri
          sudo -u kolibri env KOLIBRI_HOME=/library/kolibri kolibri manage migrate
          sudo -u kolibri env KOLIBRI_HOME=/library/kolibri kolibri manage provisiondevice --facility "IIAB School" \
            --preset formal --superusername admin --superuserpassword admin123 --language_id en --noinput
          cat <<'EOF' | sudo tee /etc/systemd/system/kolibri.service
          [Unit]
          Description=Kolibri
          [Service]
          Type=forking
          RemainAfterExit=yes
          Environment=KOLIBRI_USER=kolibri
          Environment=KOLIBRI_HOME=/library/kolibri
          Environment=KOLIBRI_HTTP_PORT=8009
          Environment=KOLIBRI_URL_PATH_PREFIX=/kolibri
          User=kolibri
          TimeoutStartSec=600
          ExecStart=/usr/local/bin/kolibri start
          ExecStop=/usr/local/bin/kolibri stop
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl start kolibri
      - name: Run install.sh with the new wheel
        run: tools/ci_run.sh "Installer" sudo ./install.sh --wheel dist/kolibri_games-*.whl
      - name: Run install.sh again (update path)
        run: tools/ci_run.sh "Installer update" sudo ./install.sh --wheel dist/kolibri_games-*.whl
      - name: The games page answers behind the /kolibri prefix
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:8009/kolibri/ && break; sleep 2; done
          curl -fsSL http://127.0.0.1:8009/kolibri/en/kolibri_games/ | grep -q "assets/app.js"
      - name: libzim was installed for Wiki BLAZE
        run: |
          sudo -u kolibri env KOLIBRI_HOME=/library/kolibri kolibri manage kolibri_games_check > check.txt
          cat check.txt
          grep -q "libzim: installed" check.txt
      - name: Kolibri log
        if: failure()
        run: sudo tail -n 100 /library/kolibri/logs/kolibri.txt || true
