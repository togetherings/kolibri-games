name: Release

# Push a tag like v0.1.0 to publish a release. The tag must match
# kolibri_games/__init__.py's __version__.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the tag matches the version
        run: |
          VERSION="$(python -c 'import kolibri_games; print(kolibri_games.__version__)')"
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION"; exit 1; }
      - run: pip install build pytest -e .
      - run: python -m pytest -q
      - run: bash tools/build_release.sh
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="$VERSION" '$0 ~ "^## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "Kolibri Games $VERSION" --notes "$notes" \
            dist/*.whl dist/*.tar.gz dist/games/*.zim dist/SHA256SUMS install.sh
