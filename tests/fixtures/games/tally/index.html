<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tally</title>
</head>
<body>
  <!-- A test Saved Game: it keeps one number for the learner with getState/setState. -->
  <main>
    <h1>Tally</h1>
    <p>Count: <b id="count">…</b></p>
    <button type="button" id="add">Add one</button>
    <button type="button" id="exit">Back to games</button>
  </main>
  <script src="__kolibri_games__/sdk.js"></script>
  <script>
    (function () {
      var KG = window.KolibriGames;
      var count = 0;
      var shown = document.getElementById("count");
      KG.ready().then(function () { return KG.getState(); }).then(function (state) {
        count = (state && state.count) || 0;
        shown.textContent = String(count);
      });
      document.getElementById("add").addEventListener("click", function () {
        count += 1;
        KG.setState({ count: count }).then(function () { shown.textContent = String(count); });
      });
      document.getElementById("exit").addEventListener("click", function () { KG.exit(); });
    })();
  </script>
</body>
</html>
